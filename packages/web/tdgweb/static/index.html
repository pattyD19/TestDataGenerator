<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tdg — test data control plane</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/static/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">
    <img src="/static/icon.svg" alt="" width="40" height="40">
    <div>
      <h1>tdg <span class="dim">control plane</span></h1>
      <p class="sub">Fill a device with photos and video of an exact size.</p>
    </div>
  </div>
</header>

<main>
  <section class="panel">
    <h2>New pack</h2>

    <div class="presets" id="presets"></div>

    <form id="form" autocomplete="off">
      <div class="grid">
        <label>Size
          <input name="size" id="size" value="500MB" required>
          <small>25GB, 512MB, or raw bytes. The pack lands on this exactly.</small>
        </label>

        <label>Device profile
          <select name="profile" id="profile"></select>
          <small>Sets camera make and model, resolutions and video mode.</small>
        </label>

        <label>Photo share of bytes
          <input type="range" name="photo_fraction" id="photo_fraction"
                 min="0" max="1" step="0.05" value="0.7">
          <small><span id="fraction_label">70%</span> stills. File count follows
            from this &mdash; 26,000 small files stress a client very differently
            from 200 large ones.</small>
        </label>

        <label>Photo format
          <select name="photo_format" id="photo_format">
            <option value="jpeg">JPEG</option>
            <option value="heic">HEIC</option>
            <option value="mixed">Mixed — HEIC and JPEG</option>
          </select>
          <small>HEIC is what a real iPhone shoots. Mixed is the realistic
            library: HEIC from the camera, JPEG from anything shared in.</small>
        </label>

        <label>Video codec
          <select name="video_codec" id="video_codec">
            <option value="h264">H.264</option>
            <option value="hevc">HEVC</option>
          </select>
          <small>HEVC is what a modern phone records, and costs about 14%
            more to encode. Build time is driven by the photo/video split far
            more than by this — video encodes ~17x slower per byte than
            stills.</small>
        </label>

        <label class="check">
          <span>Edge cases</span>
          <span class="row"><input type="checkbox" id="edge_cases">
            <small>Add duplicates, a zero-byte file, a truncated JPEG, a
              non-ASCII filename, a burst run and a screenshot.</small></span>
        </label>

        <label>Label <span class="opt">optional</span>
          <input name="label" id="label" placeholder="e.g. Pixel regression, ticket 4412">
          <small>Only to help you find it later.</small>
        </label>

        <label>Earliest capture <span class="opt">optional</span>
          <input name="since" id="since" placeholder="2022-01-01">
        </label>

        <label>Latest capture <span class="opt">optional</span>
          <input name="until" id="until" placeholder="2024-09-01">
        </label>
      </div>

      <div class="actions">
        <button type="submit" id="build">Build pack</button>
        <span class="err" id="formError" role="alert"></span>
      </div>
    </form>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Jobs</h2>
      <button type="button" id="reclaim" class="reclaim" hidden></button>
    </div>
    <p class="lan" id="lan"></p>
    <div id="jobs" class="jobs"><p class="dim">No jobs yet.</p></div>
    <details id="olderWrap" class="older" hidden>
      <summary id="olderSummary"></summary>
      <div id="older" class="older-list"></div>
    </details>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
